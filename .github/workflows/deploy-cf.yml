name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'functions/**'
      - '.github/workflows/deploy-cf.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: npm run build

      - name: SPA fallback for Cloudflare Pages
        run: echo '/* /index.html 200' > dist/browser/_redirects

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist/browser --project-name findnav --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
